[project]
name = "glasswing-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "glasswing-domain",
  "glasswing-adapters",
  "glasswing-compiler",
  "glasswing-control-engine",
  "glasswing-investigator",
  "glasswing-actions",
  "glasswing-audit",
  "glasswing-ingestion",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pyjwt>=2.9",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.uv.sources]
glasswing-domain = { workspace = true }
glasswing-adapters = { workspace = true }
glasswing-compiler = { workspace = true }
glasswing-control-engine = { workspace = true }
glasswing-investigator = { workspace = true }
glasswing-actions = { workspace = true }
glasswing-audit = { workspace = true }
glasswing-ingestion = { workspace = true }
