[project]
name = "glasswing-workspace"
version = "0.1.0"
description = "Glasswing procurement value-recovery control plane"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
  "packages/domain",
  "packages/adapters",
  "services/gateway",
  "services/ingestion",
  "services/compiler",
  "services/control-engine",
  "services/investigator",
  "services/actions",
  "services/audit",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.112",
  "ruff>=0.7",
  "mypy>=1.13",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/domain/src",
  "packages/adapters/src",
  "services/gateway/src",
  "services/ingestion/src",
  "services/compiler/src",
  "services/control-engine/src",
  "services/investigator/src",
  "services/actions/src",
  "services/audit/src",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["packages", "services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["glasswing_domain"]
mypy_path = "packages/domain/src"
strict = true
warn_unused_ignores = true

[tool.uv]
package = false
