requires-python = ">=3.12"
dependencies = ["glasswing-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.uv.sources]
glasswing-domain = { workspace = true }
