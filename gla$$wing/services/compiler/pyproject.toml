[project]
name = "glasswing-compiler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["glasswing-domain", "anthropic>=1.0.0", "openai>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compiler"]

[tool.uv.sources]
glasswing-domain = { workspace = true }
