[project]
name = "glasswing-adapters"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["glasswing-domain", "sqlalchemy>=2.0", "boto3>=1.35", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glasswing_adapters"]

[tool.uv.sources]
glasswing-domain = { workspace = true }
