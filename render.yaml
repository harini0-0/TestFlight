services:
  # FastAPI gateway (Docker). Serves the API on Render's $PORT.
  - type: web
    name: glasswing-api
    runtime: docker
    rootDir: glasswing
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Uvicorn must listen on the port Render provides.
      - key: PORT
        value: "8000"
      # SQLite file inside the container (ephemeral on the free plan).
      - key: DATABASE_URL
        value: sqlite:///var/glasswing.db
      # The web service's public URL (used for CORS allow-origin).
      - key: GLASSWING_WEB_ORIGIN
        value: https://glasswing-web.onrender.com

  # Next.js web app (Node).
  - type: web
    name: glasswing-web
    runtime: node
    rootDir: glasswing
    plan: free
    buildCommand: npx --yes pnpm@9 install --frozen-lockfile && npx --yes pnpm@9 --dir apps/web build
    startCommand: npx --yes pnpm@9 --dir apps/web exec next start -p $PORT
    envVars:
      # Baked into the client bundle at build time; points the app at the API.
      - key: NEXT_PUBLIC_API_URL
        value: https://glasswing-api-izmm.onrender.com
